#title{top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;padding:8px 14px}

.backdrop.show{display:flex}
.backdrop.open{background:rgba(6,12,9,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.bcard{position:relative;width:min(92vw,1100px);height:min(86vh,800px);max-height:min(86vh,800px);opacity:0;transform:translateY(24px) scale(.9);transition:opacity .32s cubic-bezier(.2,.9,.3,1.1),transform .32s cubic-bezier(.2,.9,.3,1.1);background:rgba(255,255,255,.97);color:#12261c;border-radius:20px;box-shadow:0 16px 48px rgba(0,0,0,.28);overflow:auto;box-sizing:border-box;padding:28px 28px 24px}
.backdrop.open .bcard{opacity:1;transform:none}
.backdrop.closing{background:rgba(6,12,9,0);backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0)}
.backdrop.closing .bcard{opacity:0;transform:translateY(24px) scale(.9);transition-duration:.2s;transition-timing-function:ease-in}
.bcard-x{position:absolute;top:12px;right:12px;width:44px;height:44px;border:0;border-radius:12px;background:transparent;font-size:22px;cursor:pointer;color:inherit}
.bcard h2{margin:0 48px 4px 0;font-size:26px;line-height:1.2;color:#1f6f4a}
.bcard .kod{margin:0 0 8px;font-size:13px;opacity:.65}
.bcard h3{margin:16px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.7}
.bcard p{margin:0;font-size:15px;line-height:1.45}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:stretch;margin-top:12px}
.bcard .pic{min-height:220px;height:100%;border-radius:16px;background:#d7dde8;display:flex;align-items:center;justify-content:center;font-size:15px;opacity:.8}
body.night .bcard{background:rgba(15,23,34,.97);color:#e8eef6}
body.night .bcard h2{color:#5fd29a}
body.night .bcard .pic{background:#243044}
@media (max-width:799px){.bgrid{grid-template-columns:1fr}.bcard{padding:22px 18px 18px}.bcard h2{font-size:20px}.bcard .pic{min-height:160px}}
@media (prefers-reduced-motion:reduce){.bcard,.backdrop.closing .bcard,.backdrop.open .bcard{transform:none;transition:opacity .2s linear}.backdrop{transition:background .2s linear}}

function makeLayers(p) {

function pointInRing(pt, ring) {
  var inside = false, i, j, xi, yi, xj, yj;

}

function renderPopup(b) {
  var h = "<h2 id=\"bcard-title\">" + b.name + "</h2>";
  if (b.unnamed) h += "<p class=\"kod\">Nama belum ditetapkan</p>";
  else if (b.short) h += "<p class=\"kod\">Kod: " + b.short + "</p>";
  h += "<div class=\"bgrid\"><div>";
  h += "<h3>Maklumat Bangunan</h3><p>Maklumat terperinci akan dipaparkan di sini.</p>";
  h += "<h3>Panel Solar</h3><p>Data panel solar akan ditambah kemudian.</p>";
  h += "</div><div class=\"pic\">Gambar akan ditambah</div></div>";
  return h;
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

var backdrop = document.getElementById("backdrop");
var card = document.getElementById("bcard");
var cardBody = document.getElementById("bcard-body");
var closeBtn = document.querySelector(".bcard-x");
var popupOpen = false, popupTimer = 0, selectedSrc = null, lastFocus = null, fitting = false;

function clearSelected() {
  if (selectedSrc) selectedSrc.setData({ type: "FeatureCollection", features: [] });
}
function setSelected(feat) {
  if (!selectedSrc || !feat || !feat.geometry) return;
  selectedSrc.setData({ type: "Feature", geometry: feat.geometry, properties: feat.properties || {} });
}
function trapFocus(e) {
  if (!popupOpen || e.key !== "Tab") return;
  var focusable = card.querySelectorAll("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])");
  if (!focusable.length) return;
  var first = focusable[0], last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
function recentreCampus() {
  tilted = false;
  btn.textContent = "3D";
  var opts = { padding: { top: 70, bottom: 70, left: 70, right: 70 }, pitch: 0, bearing: 0, essential: true };
  if (reduceMotion) {
    map.fitBounds(CAMPUS_BOUNDS, Object.assign(opts, { duration: 0 }));
    return;
  }
  fitting = true;
  map.fitBounds(CAMPUS_BOUNDS, Object.assign(opts, { duration: 1600, easing: easeInOutCubic }));
}
function closePopup() {
  if (!popupOpen) return;
  popupOpen = false;
  clearSelected();
  backdrop.classList.add("closing");
  backdrop.classList.remove("open");
  card.setAttribute("aria-hidden", "true");
  document.removeEventListener("keydown", trapFocus);
  clearTimeout(popupTimer);
  popupTimer = setTimeout(function () {
    backdrop.classList.remove("show", "closing");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    else map.getCanvas().focus();
    recentreCampus();
  }, reduceMotion ? 200 : 200);
}
function openPopup(b, feat, lngLat) {
  lastFocus = document.activeElement;
  cardBody.innerHTML = renderPopup(b);
  backdrop.classList.add("show");
  backdrop.classList.remove("closing");
  card.setAttribute("aria-hidden", "false");
  popupOpen = true;
  requestAnimationFrame(function () { backdrop.classList.add("open"); });
  setSelected(feat);
  closeBtn.focus();
  document.addEventListener("keydown", trapFocus);
  if (lngLat) {
    if (reduceMotion) map.jumpTo({ center: lngLat, pitch: map.getPitch(), bearing: map.getBearing() });
    else map.easeTo({ center: lngLat, duration: 500, pitch: map.getPitch(), bearing: map.getBearing() });
  }
}

map.on("load", function () {
  map.getCanvas().tabIndex = 0;
  map.setLight({ anchor: "viewport", color: "#ffffff", intensity: 0.4, position: [1.4, 210, 45] });
  if (!noLock) {
    try {
      map.setMaxBounds(CAMPUS_BOUNDS);
      map.addSource("mask", { type: "geojson", data: maskData });
      map.addSource("campus-line", { type: "geojson", data: outlineData });
      var pLock = night ? palettes.night : palettes.day;
      map.addLayer({
        id: "mask-fill", type: "fill", source: "mask",
        paint: { "fill-color": pLock.bg, "fill-opacity": 0.85, "fill-antialias": true }
      }, "road-name");
      map.addLayer({
        id: "campus-outline", type: "line", source: "campus-line",
        paint: { "line-color": pLock.outline, "line-width": 2, "line-opacity": 0.8 }
      }, "road-name");
    } catch (e) {
      console.warn("campus lock skipped", e);
    }
  }
  try {
    var p = night ? palettes.night : palettes.day;
    map.addSource("building-labels", { type: "geojson", data: labelData });
    map.addSource("selected", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    selectedSrc = map.getSource("selected");
    map.addLayer({
      id: "selected-bldg", type: "fill-extrusion", source: "selected",
      paint: {
        "fill-extrusion-color": p.selected,
        "fill-extrusion-height": bldgH,
        "fill-extrusion-base": bldgB,
        "fill-extrusion-opacity": 0.95
      }
    });
    map.addLayer({
      id: "building-dots", type: "circle", source: "building-labels",
      paint: {
        "circle-radius": ["interpolate", ["linear"], ["zoom"], 15, 3, 19, 5],
        "circle-color": p.dot,
        "circle-stroke-width": 1.5,
        "circle-stroke-color": "#ffffff"
      }
    });
    map.addLayer({
      id: "building-labels", type: "symbol", source: "building-labels", minzoom: 0,
      layout: {
        "text-field": ["step", ["zoom"], ["get", "short"], 16.8, ["get", "name"]],
        "text-font": ["Noto Sans Bold"],
        "text-size": ["interpolate", ["linear"], ["zoom"], 15, 10, 19, 14],
        "text-max-width": 8,
        "text-anchor": "bottom",
        "text-offset": [0, -0.3],
        "text-pitch-alignment": "viewport",
        "text-rotation-alignment": "viewport",
        "text-allow-overlap": true,
        "text-ignore-placement": true,
        "symbol-sort-key": ["-", ["get", "rank"]]
      },
      paint: {
        "text-color": p.label,
        "text-halo-color": p.labelHalo,
        "text-halo-width": 2
      }
    });
  } catch (e) {
    console.warn("building labels skipped", e);
  }
});

map.on("click", function (e) {
  try {
    if (popupOpen) return;
    var hit = map.queryRenderedFeatures(e.point, { layers: ["building-labels", "building-dots", "building-3d", "building-roof"] });
    if (!hit.length) return;
    var feat = hit[0];
    var b = null;
    if (feat.layer && (feat.layer.id === "building-labels" || feat.layer.id === "building-dots")) {
      b = buildingAtPoint(feat.geometry.coordinates) || BUILDINGS.filter(function (x) { return x.id === feat.properties.id; })[0];
    }
    if (!b) b = buildingInGeom(feat.geometry);
    if (!b && !CLICKABLE_FACULTY_ONLY) {
      var osmName = feat.properties && (feat.properties["name:ms"] || feat.properties.name);
      b = osmName
        ? { name: osmName, short: "", lon: e.lngLat.lng, lat: e.lngLat.lat }
        : { name: "Bangunan", short: "", unnamed: true, lon: e.lngLat.lng, lat: e.lngLat.lat };
    }
    if (!b) return;
    var poly = hit.filter(function (f) { return f.layer.id === "building-3d" || f.layer.id === "building-roof"; })[0];
    openPopup(b, poly || feat, [b.lon || e.lngLat.lng, b.lat || e.lngLat.lat]);
  } catch (err) {
    console.warn("building click skipped", err);
  }
});
function hoverFaculty(e) {
  try {
    if (!CLICKABLE_FACULTY_ONLY) { map.getCanvas().style.cursor = "pointer"; return; }
    if (e.features && e.features[0] && (e.features[0].layer.id === "building-labels" || e.features[0].layer.id === "building-dots")) {
      map.getCanvas().style.cursor = "pointer";
      return;
    }
    var hits = map.queryRenderedFeatures(e.point, { layers: ["building-3d", "building-roof"] });
    var ok = false;
    for (var i = 0; i < hits.length; i++) if (buildingInGeom(hits[i].geometry)) { ok = true; break; }
    map.getCanvas().style.cursor = ok ? "pointer" : "";
  } catch (err) {}
}
["building-3d", "building-roof", "building-labels", "building-dots"].forEach(function (id) {
  map.on("mousemove", id, hoverFaculty);
  map.on("mouseleave", id, function () { map.getCanvas().style.cursor = ""; });
});
closeBtn.onclick = function (e) { e.stopPropagation(); closePopup(); };
card.onclick = function (e) { e.stopPropagation(); };
backdrop.onclick = function () { closePopup(); };
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePopup(); });
["mousedown", "touchstart", "wheel", "dragstart"].forEach(function (ev) {
  map.on(ev, function () { if (fitting) { fitting = false; map.stop(); } });
});
map.on("moveend", function () { fitting = false; });

var tilted = true, btn = document.getElementById("tilt");
btn.onclick = function () {
  tilted = !tilted;
  map.easeTo({ pitch: tilted ? 60 : 0, bearing: tilted ? -20 : 0, duration: 700 });
  btn.textContent = tilted ? "2D" : "3D";
};
var tb = document.getElementById("theme");
tb.onclick = function () {
  night = !night;
  applyPalette(night ? palettes.night : palettes.day);
  document.body.style.background = night ? palettes.night.bg : palettes.day.bg;
  tb.textContent = night ? "🌙" : "☀";
};

if (/\bdebug\b/.test(location.search)) {
  var dbg = document.createElement("div");
  dbg.id = "debug";
  dbg.className = "chip";
  document.body.appendChild(dbg);
  function fmt(lng, lat) {
    return Number(lng).toFixed(6) + ", " + Number(lat).toFixed(6);
  }
  function showCentre() {
    var c = map.getCenter();
    dbg.textContent = "pusat " + fmt(c.lng, c.lat) + " z" + map.getZoom().toFixed(2);
  }
  map.on("move", showCentre);
  map.on("click", function (e) {
    var t = fmt(e.lngLat.lng, e.lngLat.lat);
    console.log("tap", [e.lngLat.lng, e.lngLat.lat]);
    dbg.textContent = "tap " + t;
  });
  showCentre();
}
</script>
</body>
</html>
