<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTeM SunGrid – Peta Kampus</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
#map{position:fixed;inset:0}
.chip{position:fixed;background:rgba(255,255,255,.92);color:#12261c;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.2);z-index:2}
#title{top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;padding:8px 14px}
#title b{display:block;font-size:15px;color:#1f6f4a}
#title span{font-size:12px;opacity:.75}
#sat{right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);width:46px;height:46px;border:0;font-weight:700;font-size:12px;color:#1f6f4a;cursor:pointer}
#tilt{right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:46px;height:46px;border:0;font-weight:700;font-size:14px;color:#1f6f4a;cursor:pointer}
</style>
</head>
<body>
<div id="map"></div>
<div class="chip" id="title"><b>UTeM SunGrid</b><span>Peta Kampus UTeM</span></div>
<button class="chip" id="tilt">3D</button>
<button class="chip" id="sat">SAT</button>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// Satellite tiles come through our own /api/tile endpoint, so the MapTiler key stays on the server.
// Satellite (MapTiler HD, falls back to Esri) + OpenStreetMap roads/3D buildings (OpenFreeMap). No API keys.
var style = {
  version: 8,
  glyphs: "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
  sources: {
    omt: { type: "vector", url: "https://tiles.openfreemap.org/planet" },
    sat: { type: "raster", tileSize: 512, maxzoom: 20,
      tiles: [location.origin + "/api/tile?z={z}&x={x}&y={y}"],
      attribution: "© MapTiler" }
  },
  layers: [
    { id:"bg", type:"background", paint:{ "background-color":"#1c2b25" } },
    { id:"sat", type:"raster", source:"sat",
      paint:{ "raster-saturation":0.05, "raster-contrast":0.1 } },
    { id:"road", type:"line", source:"omt", "source-layer":"transportation",
      filter:["in","class","motorway","trunk","primary","secondary","tertiary","minor","service"],
      layout:{ "line-cap":"round","line-join":"round" },
      paint:{ "line-color":["match",["get","class"],["motorway","trunk","primary"],"#ffd25a","#ffffff"],
        "line-opacity":0.55,
        "line-width":["interpolate",["exponential",1.5],["zoom"],13,.5,17,["match",["get","class"],["motorway","trunk","primary","secondary"],6,["tertiary","minor"],3.5,1.5],20,["match",["get","class"],["motorway","trunk","primary","secondary"],28,["tertiary","minor"],16,6]] } },
    { id:"building-3d", type:"fill-extrusion", source:"omt", "source-layer":"building", minzoom:14,
      paint:{
        "fill-extrusion-color":["interpolate",["linear"],["coalesce",["get","render_height"],8],0,"#fffdf7",40,"#e9dcff"],
        "fill-extrusion-height":["coalesce",["get","render_height"],8],
        "fill-extrusion-base":["coalesce",["get","render_min_height"],0],
        "fill-extrusion-opacity":0.45 } },
    { id:"road-name", type:"symbol", source:"omt", "source-layer":"transportation_name", minzoom:16,
      layout:{ "symbol-placement":"line","text-field":["coalesce",["get","name:ms"],["get","name"]],"text-font":["Noto Sans Regular"],"text-size":11 },
      paint:{ "text-color":"#ffffff","text-halo-color":"rgba(0,0,0,.65)","text-halo-width":1.5 } },
    { id:"place", type:"symbol", source:"omt", "source-layer":"poi", minzoom:16,
      filter:["in","class","school","college","place_of_worship","library"],
      layout:{ "text-field":["coalesce",["get","name:ms"],["get","name"]],"text-font":["Noto Sans Regular"],"text-size":12,"text-offset":[0,.6],"text-anchor":"top" },
      paint:{ "text-color":"#ffffff","text-halo-color":"rgba(0,0,0,.7)","text-halo-width":1.5 } }
  ]
};

var map = new maplibregl.Map({
  container: "map", style: style,
  center: [102.3205, 2.3142], zoom: 17, pitch: 55, bearing: -20,
  maxPitch: 70, minZoom: 14, maxZoom: 21, attributionControl: false
});
map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: "© OpenStreetMap contributors · OpenFreeMap" }), "bottom-left");
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");

var tilted = true, btn = document.getElementById("tilt");
btn.onclick = function () {
  tilted = !tilted;
  map.easeTo({ pitch: tilted ? 55 : 0, bearing: tilted ? -20 : 0, duration: 700 });
  btn.textContent = tilted ? "3D" : "2D";
};
var satOn = true, sb = document.getElementById("sat");
sb.onclick = function () {
  satOn = !satOn;
  map.setLayoutProperty("sat", "visibility", satOn ? "visible" : "none");
  map.setPaintProperty("bg", "background-color", satOn ? "#1c2b25" : "#eef0f6");
  sb.textContent = satOn ? "SAT" : "MAP";
};
</script>
</body>
</html>
